name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Smoke pipeline on the synthetic fixture
        run: |
          uv run finmesh fixture
          uv run finmesh week1 --dataset FIXTURE-Small
          uv run finmesh g0 --dataset FIXTURE-Small
          uv run finmesh feature-timing --dataset FIXTURE-Small
          uv run finmesh labels --dataset FIXTURE-Small
          uv run finmesh harness-check --dataset FIXTURE-Small --reps 200
          uv run finmesh sealed-log --dataset FIXTURE-Small
          uv run finmesh features --dataset FIXTURE-Small
          uv run finmesh feature-report --dataset FIXTURE-Small
          uv run finmesh diagnose --dataset FIXTURE-Small
          uv run finmesh features --dataset FIXTURE-Small --view pooled
          uv run finmesh baselines --dataset FIXTURE-Small --reps 200 --draws 5
          uv run finmesh share --dataset FIXTURE-Small --reps 200
          uv run finmesh x1 --dataset FIXTURE-Small --seeds 0,1 --reps 200
          uv run finmesh demo-slice --dataset FIXTURE-Small --alerts 20
          uv run finmesh g2
          uv run finmesh x4 --dataset FIXTURE-Small --seeds 0 --reps 50 --rounds 5 --local-steps 5
          uv run finmesh dp-tune --dataset FIXTURE-Small --quick --rounds 5 --local-steps 5
          uv run finmesh features --dataset FIXTURE-Small --degree-cap 16
          uv run finmesh influence --dataset FIXTURE-Small --sample 20
          uv run finmesh x5 --dataset FIXTURE-Small --seeds 0 --reps 50 --rounds 5 --local-steps 5
          uv run finmesh membership --dataset FIXTURE-Small --reps 50 --rounds 5 --local-steps 5
          uv run finmesh ensemble --dataset FIXTURE-Small --reps 50
          uv run finmesh g3
          uv run finmesh check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

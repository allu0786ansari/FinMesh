name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Smoke pipeline on the synthetic fixture
        run: |
          uv run finmesh fixture
          uv run finmesh week1 --dataset FIXTURE-Small
          uv run finmesh g0 --dataset FIXTURE-Small
          uv run finmesh feature-timing --dataset FIXTURE-Small
          uv run finmesh labels --dataset FIXTURE-Small
          uv run finmesh harness-check --dataset FIXTURE-Small --reps 200
          uv run finmesh sealed-log --dataset FIXTURE-Small
          uv run finmesh features --dataset FIXTURE-Small
          uv run finmesh feature-report --dataset FIXTURE-Small
          uv run finmesh diagnose --dataset FIXTURE-Small
          uv run finmesh features --dataset FIXTURE-Small --view pooled
          uv run finmesh baselines --dataset FIXTURE-Small --reps 200 --draws 5
          uv run finmesh share --dataset FIXTURE-Small --reps 200
          uv run finmesh x1 --dataset FIXTURE-Small --seeds 0,1 --reps 200
          uv run finmesh demo-slice --dataset FIXTURE-Small --alerts 20
          uv run finmesh g2
          uv run finmesh x4 --dataset FIXTURE-Small --seeds 0 --reps 50 --rounds 5 --local-steps 5
          uv run finmesh dp-tune --dataset FIXTURE-Small --quick --rounds 5 --local-steps 5
          uv run finmesh features --dataset FIXTURE-Small --degree-cap 16
          uv run finmesh influence --dataset FIXTURE-Small --sample 20
          uv run finmesh x5 --dataset FIXTURE-Small --seeds 0 --reps 50 --rounds 5 --local-steps 5
          uv run finmesh membership --dataset FIXTURE-Small --reps 50 --rounds 5 --local-steps 5
          uv run finmesh ensemble --dataset FIXTURE-Small --reps 50
          uv run finmesh g3
          uv run finmesh x6 --dataset FIXTURE-Small --seeds 0 --reps 100
          uv run finmesh test-x1 --dataset FIXTURE-Small --headline-seeds 0,1 --seeds 0 --reps 50 --window-reps 20
          uv run finmesh test-baselines --dataset FIXTURE-Small --reps 50
          uv run finmesh test-x5 --dataset FIXTURE-Small --reps 20
          uv run finmesh test-ensemble --dataset FIXTURE-Small --reps 20
          uv run finmesh test-report --fixture
          uv run finmesh sealed-log --dataset FIXTURE-Small
          uv run finmesh federation --dataset FIXTURE-Small --option A8 --force
          uv run finmesh labels --dataset FIXTURE-Small --option A8
          uv run finmesh features --dataset FIXTURE-Small --option A8
          uv run finmesh features --dataset FIXTURE-Small --option A8 --view pooled
          uv run finmesh x1 --dataset FIXTURE-Small --option A8 --seeds 0 --reps 50 --no-sweeps --no-audit
          uv run finmesh federation --dataset FIXTURE-Small --option B8c50 --force
          uv run finmesh labels --dataset FIXTURE-Small --option B8c50
          uv run finmesh features --dataset FIXTURE-Small --option B8c50
          uv run finmesh features --dataset FIXTURE-Small --option B8c50 --view pooled
          uv run finmesh x1 --dataset FIXTURE-Small --option B8c50 --seeds 0 --reps 50 --no-sweeps --no-audit
          uv run finmesh coverage --dataset FIXTURE-Small
          uv run finmesh check

  container:
    # Both images (week 19): the runtime image runs X7 on the synthetic smoke world; the
    # full image runs the pipeline's smoke stage on this checkout and data volume, parses
    # every stage, and rebuilds the paper's tables identically from the committed pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use the runner's user and group inside the containers
        run: |
          echo "FINMESH_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "FINMESH_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p data
      - name: Build the images
        run: |
          docker build --target runtime -t finmesh:local .
          docker build --target full -t finmesh:full .
      - name: X7 smoke inside the runtime image
        run: docker run --rm finmesh:local x7 --smoke --node-timeout 1
      - name: Compose file is valid for every profile
        run: |
          for p in smoke console pipeline cli paper ci llm; do
            docker compose --profile "$p" config --quiet
          done
      - name: Every pipeline stage parses (dry run)
        run: |
          for s in data validation validation-llm primary primary-llm replication \
                   replication-llm paper; do
            docker compose --profile pipeline run --rm pipeline "$s" --dry-run > /dev/null
          done
      - name: Pipeline smoke stage in the full image (checkout and data mounted)
        run: docker compose --profile pipeline run --rm pipeline smoke
      - name: Paper tables rebuild identically inside the container
        run: |
          docker compose --profile paper run --rm paper
          git diff --exit-code -- docs/paper/tables docs/paper/assets.json
          git diff --stat -- docs/paper/figures || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

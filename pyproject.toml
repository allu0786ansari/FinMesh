[project]
name = "finmesh"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Privacy-preserving cross-bank financial-crime detection: measuring the utility-leakage frontier of evidence sharing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Allaudin Ansari" }]
dependencies = [
    "polars>=1.0,<2",
    "pyarrow>=15",
    "pyyaml>=6",
    "numpy>=1.26",
    "rbcl>=1.1,<2",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Later weeks add their own groups (models, federation, services, llm) so
# that a week-1 checkout installs in seconds on an 8 GB machine.
kaggle = ["kaggle>=1.6"]

[project.scripts]
finmesh = "finmesh.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finmesh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters (ε, δ, –) in docs/strings

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["finmesh"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "rbcl", "rbcl.*", "lightgbm", "lightgbm.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "real_data: needs the real AMLworld files under FINMESH_DATA (skipped otherwise)",
]

[tool.coverage.run]
source = ["finmesh"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
